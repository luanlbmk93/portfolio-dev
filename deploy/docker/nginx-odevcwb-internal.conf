server {
    listen 80;
    server_name _;

    client_max_body_size 4m;

    root /usr/share/nginx/html/portfolio;
    index index.html;

    # Portfolio — raiz
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Separador PDF
    location = /separadorpdf {
        return 301 /separadorpdf/;
    }

    location /separadorpdf/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /separadorpdf/index.html;
    }

    # Disparador — frontend (root + path = sem bug de alias nos assets)
    location = /disparador-gmail {
        return 301 /disparador-gmail/;
    }

    location /disparador-gmail/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /disparador-gmail/index.html;
    }

    # Disparador — API
    location /disparador-gmail/api/ {
        proxy_pass http://odevcwb-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
