services:
  odevcwb-web:
    image: nginx:1.27-alpine
    container_name: odevcwb-web
    restart: unless-stopped
    volumes:
      - ./nginx-odevcwb-internal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./portfolio/dist:/usr/share/nginx/html/portfolio:ro
      - ./separador/dist:/usr/share/nginx/html/separador:ro
      - ./disparador-gmail/client/dist:/usr/share/nginx/html/disparador:ro
    networks:
      - nexo
    # NÃO publica 80/443 no host — só na rede Docker (nexo-web faz o proxy)

  odevcwb-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: odevcwb-api
    restart: unless-stopped
    env_file:
      - ./disparador-gmail/.env
    environment:
      PORT: 3100
      BASE_PATH: /disparador-gmail
      NODE_ENV: production
    networks:
      - nexo
    # Sem ports: — API só acessível dentro da rede Docker

networks:
  nexo:
    external: true
    name: ${NEXO_DOCKER_NETWORK:-docker_default}
