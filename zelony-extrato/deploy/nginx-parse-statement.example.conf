# Trecho Nginx: extrato sem IA (Python / uvicorn :8000)
# 502 = upstream morto ou rota indo para o Node em vez do Python.

location /parse-statement {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

location = /health {
    proxy_pass http://127.0.0.1:8000;
}

# /api/login, /api/proxy-gemini, etc. → Node (porta 3000), NÃO misturar com o bloco acima.
